name: Tools doc vs server

# Checks docs/tools.json and docs/tools.md against the live server's
# tools/list. Needs the repository secret YRIIST_DOCS_TOKEN: a personal token
# (yrp_…) with all four scopes (research, read, write, agent). Without it the
# job says so and passes: forks and fresh clones have no token.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      YRIIST_TOKEN: ${{ secrets.YRIIST_DOCS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: No token
        if: env.YRIIST_TOKEN == ''
        run: echo "::notice::YRIIST_DOCS_TOKEN is not set; the live check is skipped"
      - name: docs/tools.json and docs/tools.md match the server
        if: env.YRIIST_TOKEN != ''
        run: node scripts/gen-tools-doc.mjs --check
